<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 112" width="120" height="112">
  <title>הליצן מחייך ומחכה</title>
  <!-- ruffled collar -->
  <path d="M22 98q6-10 12 0q6-10 13 0q6-10 13 0q7-10 13 0q6-10 13 0q6-10 12 0q-4 10-38 12q-34-2-38-12z" fill="#FFE15A" stroke="#2B1E4A" stroke-width="3" stroke-linejoin="round"/>
  <!-- curly hair, left and right -->
  <g stroke="#2B1E4A" stroke-width="3">
    <circle cx="27" cy="50" r="10" fill="#FF5FA8"/>
    <circle cx="21" cy="64" r="10" fill="#2E9BFF"/>
    <circle cx="27" cy="78" r="10" fill="#1FCB8C"/>
    <circle cx="93" cy="50" r="10" fill="#FF5FA8"/>
    <circle cx="99" cy="64" r="10" fill="#2E9BFF"/>
    <circle cx="93" cy="78" r="10" fill="#1FCB8C"/>
  </g>
  <!-- face -->
  <ellipse cx="60" cy="64" rx="30" ry="31" fill="#FFFFFF" stroke="#2B1E4A" stroke-width="4"/>
  <!-- party hat -->
  <path d="M40 40L62 6L82 40q-21 6-42 0z" fill="#8B5CF6" stroke="#2B1E4A" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M50 25l6 4M66 18l6 5M58 34l7 3" stroke="#FFE15A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62" cy="6" r="6" fill="#FFE15A" stroke="#2B1E4A" stroke-width="3"/>
  <!-- cheeks -->
  <circle cx="40" cy="76" r="6" fill="#FF8FB8"/>
  <circle cx="80" cy="76" r="6" fill="#FF8FB8"/>
  <path d="M47 43l3 5-3 5-3-5z M73 43l3 5-3 5-3-5z" fill="#2E9BFF" stroke="#2B1E4A" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="47" cy="58" rx="6" ry="7.5" fill="#FFFFFF" stroke="#2B1E4A" stroke-width="3"/>
  <ellipse cx="73" cy="58" rx="6" ry="7.5" fill="#FFFFFF" stroke="#2B1E4A" stroke-width="3"/>
  <circle cx="48" cy="56" r="3.2" fill="#2B1E4A"/>
  <circle cx="74" cy="56" r="3.2" fill="#2B1E4A"/>
  <!-- big painted smile -->
  <path d="M40 78q20 22 40 0q-20 12-40 0z" fill="#F23D2F" stroke="#2B1E4A" stroke-width="3" stroke-linejoin="round"/>
  <!-- red nose -->
  <circle cx="60" cy="68" r="8" fill="#F23D2F" stroke="#2B1E4A" stroke-width="3"/>
  <ellipse cx="57" cy="65" rx="2.5" ry="1.8" fill="#FFFFFF" opacity=".9"/>
</svg>
