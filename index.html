<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הבדיחות של דובב</title>
<meta name="description" content="כותבים נושא, לוחצים, וצוחקים.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFE15A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFE15A;
    --paper: #FFFFFF;
    --ink: #2B1E4A;
    --ink-soft: #4A3D6B;
    --red: #F23D2F;
    --blue: #2E9BFF;
    --error: #C0261B;
    --error-bg: #FFE8EC;
    --hint: #756B92;
    --pink: #FF5FA8;
    --mint: #1FCB8C;
    --violet: #8B5CF6;
    --wood: #C98B4F;
    --nail: #B8B3C9;
    --ui-font: "Fredoka", system-ui, sans-serif;
    --joke-font: "Playpen Sans Hebrew", "Fredoka", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sun);
    color: var(--ink);
    font-family: var(--ui-font);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* רקע העיר העתידנית. שכבה קבועה מאחורי הכל, כי background-attachment: fixed לא עובד טוב באייפון */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: url("assets/bg-future.jpg") center / cover no-repeat;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 24px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  /* הלוגו: "הבדיחות" באותיות צבעוניות קופצות, ו"של דובב" על קרש עץ ממוסמר */
  .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; }
  .logo-word { display: flex; font: 700 clamp(48px, 15vw, 68px)/1 var(--ui-font); }
  .logo-word span {
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    text-shadow: 4px 4px 0 var(--ink);
  }
  .logo-word span:nth-child(1) { color: var(--blue); transform: rotate(-6deg) translateY(4px); }
  .logo-word span:nth-child(2) { color: var(--pink); transform: rotate(5deg) translateY(-3px); }
  .logo-word span:nth-child(3) { color: var(--sun); transform: rotate(-4deg) translateY(2px); }
  .logo-word span:nth-child(4) { color: var(--mint); transform: rotate(7deg) translateY(-4px); }
  .logo-word span:nth-child(5) { color: var(--violet); transform: rotate(-5deg) translateY(3px); }
  .logo-word span:nth-child(6) { color: var(--red); transform: rotate(4deg); }
  .logo-word span:nth-child(7) { color: var(--blue); transform: rotate(-3deg) translateY(-2px); }
  .plank {
    position: relative;
    font: 700 36px/1 var(--ui-font);
    color: #fff;
    -webkit-text-stroke: 2.5px var(--ink);
    paint-order: stroke fill;
    padding: 8px 40px 10px;
    background:
      repeating-linear-gradient(176deg, transparent 0 7px, rgba(90, 50, 15, 0.22) 7px 9px),
      var(--wood);
    border: 3px solid var(--ink);
    border-radius: 10px 6px 12px 7px;
    box-shadow: 5px 5px 0 var(--ink);
    transform: rotate(-3deg);
  }
  /* שני מסמרים בקצוות הקרש */
  .plank::before, .plank::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--nail);
    border: 2px solid var(--ink);
  }
  .plank::before { right: 12px; }
  .plank::after { left: 12px; }

  h1 { margin: 0; }

  .intro {
    margin: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  label { font-size: 18px; font-weight: 600; }

  .topic {
    width: 100%;
    font: 500 19px var(--ui-font);
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 12px 16px;
    margin-top: 6px;
    transform: rotate(0.6deg);
  }
  .topic::placeholder { color: var(--hint); }
  .topic:focus { outline: 4px solid var(--blue); outline-offset: 2px; }

  .go {
    min-height: 64px;
    width: 100%;
    font: 700 24px var(--ui-font);
    color: #fff;
    background: var(--red);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 8px 0 var(--ink);
    transform: rotate(-1deg);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
    margin-bottom: 6px;
  }
  .go:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
  .go:active,
  .go:disabled {
    transform: rotate(-1deg) translateY(6px);
    box-shadow: 0 2px 0 var(--ink);
  }
  .go:disabled { cursor: wait; }

  .bubble {
    position: relative;
    min-height: 190px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-1.2deg);
    padding: 18px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }

  /* הדמות היא התמונה של דובב: עיגול עם קו מתאר בדיו, כמו שאר הרכיבים */
  .mascot { width: 118px; height: auto; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 3px var(--ink); }

  .message {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  /* בדיחה: הדמות קופצת לפינה, והטקסט בכתב יד */
  .bubble[data-state="joke"] { padding-top: 46px; }
  .bubble[data-state="joke"] .mascot {
    position: absolute;
    top: -38px;
    right: -22px;
    width: 86px;
    transform: rotate(8deg);
  }
  .bubble[data-state="joke"] .message {
    font: 500 25px/1.55 var(--joke-font);
    color: var(--ink);
  }

  /* שגיאה */
  .bubble[data-state="error"] { background: var(--error-bg); }
  .bubble[data-state="error"] .message { color: var(--error); font-weight: 600; }

  footer {
    padding: 8px 18px 18px;
    font-size: 13px;
    color: var(--ink);
    text-align: center;
  }
  /* רקע לבן שקוף למחצה, כדי שהשורה תיקרא מעל העיר */
  footer span {
    display: inline-block;
    background: rgba(255, 255, 255, 0.75);
    border-radius: 999px;
    padding: 4px 12px;
  }

  /* תנועה */
  @keyframes bob { 50% { transform: translateY(-5px); } }
  @keyframes squish { 50% { transform: scale(1, 0.86); } }
  @keyframes roll { 0%, 100% { transform: rotate(8deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(18deg); } }
  @keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

  .bubble[data-state="idle"] .mascot { animation: bob 2.4s ease-in-out infinite; }
  .bubble[data-state="think"] .mascot { animation: squish 0.5s ease-in-out infinite; transform-origin: bottom; }
  .bubble[data-state="joke"] .mascot { animation: roll 0.6s ease-in-out 4; }
  .bubble[data-state="error"] .mascot { animation: wobble 0.5s ease-in-out 2; }

  @media (prefers-reduced-motion: reduce) {
    .mascot { animation: none !important; }
    .go { transition: none; }
  }
</style>
</head>
<body>

<main>
  <h1 class="logo" aria-label="הבדיחות של דובב"><span class="logo-word" aria-hidden="true"><span>ה</span><span>ב</span><span>ד</span><span>י</span><span>ח</span><span>ו</span><span>ת</span></span><span class="plank" aria-hidden="true">של דובב</span></h1>
  <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

  <form id="form">
    <label for="topic">על מה הבדיחה?
      <input class="topic" id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off">
    </label>
    <button class="go" id="go" type="submit">תנו לי בדיחה!</button>
  </form>

  <section class="bubble" id="bubble" data-state="idle">
    <img class="mascot" id="mascot" src="assets/mascot-dovev.jpg" alt="">
    <p class="message" id="message" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
  </section>
</main>

<footer><span>מיישם AI ואוטומציה · 53500</span></footer>

<script>
  const form = document.getElementById("form");
  const topicInput = document.getElementById("topic");
  const button = document.getElementById("go");
  const bubble = document.getElementById("bubble");
  const mascot = document.getElementById("mascot");
  const message = document.getElementById("message");

  const BUTTON_TEXT = { idle: "תנו לי בדיחה!", think: "חושב...", joke: "עוד בדיחה!", error: "לנסות שוב" };

  function show(state, text) {
    bubble.dataset.state = state;
    message.textContent = text;
    button.textContent = BUTTON_TEXT[state];
    button.disabled = state === "think";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const topic = topicInput.value.trim();
    show("think", topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה...");

    try {
      const response = await fetch("/api/joke", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.joke) {
        show("error", data.error || "אופס, הבדיחה הלכה לאיבוד. נסו שוב.");
        return;
      }
      show("joke", data.joke);
    } catch (error) {
      console.error(error);
      show("error", "אין חיבור לאינטרנט. נסו שוב.");
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
