<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הבדיחות של דובב</title>
<meta name="description" content="כותבים נושא, לוחצים, וצוחקים.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFE15A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFE15A;
    --paper: #FFFFFF;
    --ink: #2B1E4A;
    --ink-soft: #4A3D6B;
    --red: #F23D2F;
    --blue: #2E9BFF;
    --error: #C0261B;
    --error-bg: #FFE8EC;
    --hint: #756B92;
    --mint-bg: #E3F9EF;
    --pink: #FF5FA8;
    --mint: #1FCB8C;
    --violet: #8B5CF6;
    --wood: #C98B4F;
    --nail: #B8B3C9;
    --ui-font: "Fredoka", system-ui, sans-serif;
    --joke-font: "Playpen Sans Hebrew", "Fredoka", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sun);
    color: var(--ink);
    font-family: var(--ui-font);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* רקע העיר העתידנית. שכבה קבועה מאחורי הכל, כי background-attachment: fixed לא עובד טוב באייפון */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: url("assets/bg-future.jpg") center / cover no-repeat;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 24px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  /* הלוגו: "הבדיחות" באותיות צבעוניות קופצות, ו"של דובב" על קרש עץ ממוסמר */
  .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; }
  .logo-word { display: flex; font: 700 clamp(48px, 15vw, 68px)/1 var(--ui-font); }
  .logo-word span {
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    text-shadow: 4px 4px 0 var(--ink);
  }
  .logo-word span:nth-child(1) { color: var(--blue); transform: rotate(-6deg) translateY(4px); }
  .logo-word span:nth-child(2) { color: var(--pink); transform: rotate(5deg) translateY(-3px); }
  .logo-word span:nth-child(3) { color: var(--sun); transform: rotate(-4deg) translateY(2px); }
  .logo-word span:nth-child(4) { color: var(--mint); transform: rotate(7deg) translateY(-4px); }
  .logo-word span:nth-child(5) { color: var(--violet); transform: rotate(-5deg) translateY(3px); }
  .logo-word span:nth-child(6) { color: var(--red); transform: rotate(4deg); }
  .logo-word span:nth-child(7) { color: var(--blue); transform: rotate(-3deg) translateY(-2px); }
  .plank {
    position: relative;
    font: 700 36px/1 var(--ui-font);
    color: #fff;
    -webkit-text-stroke: 2.5px var(--ink);
    paint-order: stroke fill;
    padding: 8px 40px 10px;
    background:
      repeating-linear-gradient(176deg, transparent 0 7px, rgba(90, 50, 15, 0.22) 7px 9px),
      var(--wood);
    border: 3px solid var(--ink);
    border-radius: 10px 6px 12px 7px;
    box-shadow: 5px 5px 0 var(--ink);
    transform: rotate(-3deg);
  }
  /* שני מסמרים בקצוות הקרש */
  .plank::before, .plank::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--nail);
    border: 2px solid var(--ink);
  }
  .plank::before { right: 12px; }
  .plank::after { left: 12px; }

  h1 { margin: 0; }

  .intro {
    margin: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  label { font-size: 18px; font-weight: 600; }

  .topic {
    width: 100%;
    font: 500 19px var(--ui-font);
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 12px 16px;
    margin-top: 6px;
    transform: rotate(0.6deg);
  }
  .topic::placeholder { color: var(--hint); }
  .topic:focus { outline: 4px solid var(--blue); outline-offset: 2px; }

  .go {
    min-height: 64px;
    width: 100%;
    font: 700 24px var(--ui-font);
    color: #fff;
    background: var(--red);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 8px 0 var(--ink);
    transform: rotate(-1deg);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
    margin-bottom: 6px;
  }
  .go:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
  .go:active,
  .go:disabled {
    transform: rotate(-1deg) translateY(6px);
    box-shadow: 0 2px 0 var(--ink);
  }
  .go:disabled { cursor: wait; }

  .bubble {
    position: relative;
    min-height: 190px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-1.2deg);
    padding: 18px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }

  /* הדמות היא התמונה של דובב: עיגול עם קו מתאר בדיו, כמו שאר הרכיבים */
  .mascot { width: 118px; height: auto; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 3px var(--ink); }

  .message {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  /* בדיחה: הדמות קופצת לפינה, והטקסט בכתב יד */
  .bubble[data-state="joke"] { padding-top: 46px; }
  .bubble[data-state="joke"] .mascot {
    position: absolute;
    top: -38px;
    right: -22px;
    width: 86px;
    transform: rotate(8deg);
  }
  .bubble[data-state="joke"] .message {
    font: 500 25px/1.55 var(--joke-font);
    color: var(--ink);
  }

  /* שגיאה */
  .bubble[data-state="error"] { background: var(--error-bg); }

  /* טריוויה: השאלה בכתב יד כמו הבדיחה, והתמונה בפינה */
  .bubble[data-state="question"], .bubble[data-state="answer"] { padding-top: 46px; }
  .bubble[data-state="question"] .mascot, .bubble[data-state="answer"] .mascot {
    position: absolute; top: -38px; right: -22px; width: 86px; transform: rotate(8deg);
  }
  .bubble[data-state="question"] .message, .bubble[data-state="answer"] .message {
    font: 500 23px/1.5 var(--joke-font); color: var(--ink);
  }

  .reveal {
    font: 700 19px var(--ui-font);
    color: var(--ink);
    background: var(--sun);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 5px 0 var(--ink);
    padding: 8px 24px;
    cursor: pointer;
  }
  .reveal:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .reveal:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

  .answer {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--mint-bg);
    border: 3px dashed var(--mint);
    border-radius: 16px;
    padding: 10px 14px;
  }
  .answer strong { font: 700 22px/1.3 var(--ui-font); color: var(--ink); }
  .answer span { font-size: 16px; color: var(--ink-soft); }

  /* המתג בין בדיחה לטריוויה */
  .mode {
    align-self: center;
    display: flex;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 4px;
  }
  .mode input { position: absolute; opacity: 0; pointer-events: none; }
  .mode label { font: 600 18px var(--ui-font); padding: 6px 24px; border-radius: 999px; cursor: pointer; }
  .mode input:checked + label { background: var(--ink); color: var(--sun); }
  .mode input:focus-visible + label { outline: 3px solid var(--blue); outline-offset: 2px; }
  .bubble[data-state="error"] .message { color: var(--error); font-weight: 600; }

  footer {
    padding: 8px 18px 18px;
    font-size: 13px;
    color: var(--ink);
    text-align: center;
  }
  /* רקע לבן שקוף למחצה, כדי שהשורה תיקרא מעל העיר */
  /* כפתור הצליל: עיגול קטן בפינה, מעל הכל */
  .sound {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: calc(12px + env(safe-area-inset-left, 0px));
    z-index: 11;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: var(--paper);
    box-shadow: 3px 3px 0 var(--ink);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .sound:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }

  footer span {
    display: inline-block;
    background: rgba(255, 255, 255, 0.75);
    border-radius: 999px;
    padding: 4px 12px;
  }

  /* תנועה */
  @keyframes bob { 50% { transform: translateY(-5px); } }
  @keyframes squish { 50% { transform: scale(1, 0.86); } }
  @keyframes roll { 0%, 100% { transform: rotate(8deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(18deg); } }
  @keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

  .bubble[data-state="idle"] .mascot { animation: bob 2.4s ease-in-out infinite; }
  .bubble[data-state="think"] .mascot { animation: squish 0.5s ease-in-out infinite; transform-origin: bottom; }
  .bubble[data-state="joke"] .mascot { animation: roll 0.6s ease-in-out 4; }
  .bubble[data-state="error"] .mascot { animation: wobble 0.5s ease-in-out 2; }

  /* קונפטי: שכבה שקופה מעל כל המסך, שלא חוסמת לחיצות */
  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  @media (prefers-reduced-motion: reduce) {
    .mascot { animation: none !important; }
    .go { transition: none; }
  }
</style>
</head>
<body>

<main>
  <h1 class="logo" aria-label="הבדיחות של דובב"><span class="logo-word" aria-hidden="true"><span>ה</span><span>ב</span><span>ד</span><span>י</span><span>ח</span><span>ו</span><span>ת</span></span><span class="plank" aria-hidden="true">של דובב</span></h1>
  <p class="intro">בוחרים בדיחה או שאלת טריוויה, כותבים נושא, ולוחצים. בלי נושא, מקבלים משהו כללי.</p>

  <div class="mode" role="radiogroup" aria-label="מה לקבל?">
    <input type="radio" name="mode" id="mode-joke" value="joke" checked><label for="mode-joke">בדיחה</label>
    <input type="radio" name="mode" id="mode-trivia" value="trivia"><label for="mode-trivia">טריוויה</label>
  </div>

  <form id="form">
    <label for="topic"><span id="topic-label">על מה הבדיחה?</span>
      <input class="topic" id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off">
    </label>
    <button class="go" id="go" type="submit">תנו לי בדיחה!</button>
  </form>

  <section class="bubble" id="bubble" data-state="idle">
    <img class="mascot" id="mascot" src="assets/mascot-dovev.jpg" alt="">
    <p class="message" id="message" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    <button class="reveal" id="reveal" type="button" hidden>הראו תשובה</button>
    <div class="answer" id="answer" aria-live="polite" hidden><strong id="answer-text"></strong><span id="answer-why"></span></div>
  </section>
</main>

<button class="sound" id="sound" type="button" aria-pressed="true" aria-label="צלילים פועלים. לחיצה משתיקה">🔊</button>
<footer><span>מיישם AI ואוטומציה · 53500</span></footer>

<script>
  const form = document.getElementById("form");
  const topicInput = document.getElementById("topic");
  const button = document.getElementById("go");
  const bubble = document.getElementById("bubble");
  const mascot = document.getElementById("mascot");
  const message = document.getElementById("message");

  const reveal = document.getElementById("reveal");
  const answerBox = document.getElementById("answer");
  const answerText = document.getElementById("answer-text");
  const answerWhy = document.getElementById("answer-why");
  const topicLabel = document.getElementById("topic-label");

  // הטקסטים של כל מצב: בדיחה או טריוויה
  const TEXT = {
    joke: {
      label: "על מה הבדיחה?",
      idle: "לוחצים על הכפתור, והבדיחה מופיעה כאן",
      go: "תנו לי בדיחה!",
      again: "עוד בדיחה!",
      think: (topic) => (topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה..."),
      lost: "אופס, הבדיחה הלכה לאיבוד. נסו שוב.",
    },
    trivia: {
      label: "על מה השאלה?",
      idle: "לוחצים על הכפתור, והשאלה מופיעה כאן",
      go: "תנו לי שאלה!",
      again: "עוד שאלה!",
      think: (topic) => (topic ? `מחפש שאלה על ${topic}...` : "מחפש שאלה..."),
      lost: "אופס, השאלה הלכה לאיבוד. נסו שוב.",
    },
  };

  let mode = "joke";
  let currentTrivia = null;
  // השאלות האחרונות שהוצגו, נשלחות לשרת כדי שלא יחזרו. נשמרות בדפדפן בלבד.
  const RECENT_LIMIT = 12;
  let recentQuestions = [];
  try { recentQuestions = JSON.parse(localStorage.getItem("joke-recent-trivia") || "[]"); } catch {}
  if (!Array.isArray(recentQuestions)) recentQuestions = [];

  function rememberQuestion(question) {
    recentQuestions = [...recentQuestions.filter((q) => q !== question), question].slice(-RECENT_LIMIT);
    try { localStorage.setItem("joke-recent-trivia", JSON.stringify(recentQuestions)); } catch {}
  }
  try { if (localStorage.getItem("joke-mode") === "trivia") mode = "trivia"; } catch {}
  document.getElementById(`mode-${mode}`).checked = true;

  // צליל "בה-דום-טסס": שתי מכות תוף ומצילה, כמו אחרי פאנץ' בסטנדאפ.
  // נוצר בקוד עם Web Audio, בלי קובצי שמע. הדפדפן מרשה צליל רק אחרי לחיצה,
  // ולכן ה-AudioContext נפתח בלחיצה על הכפתור, והצליל מתנגן כשהבדיחה מגיעה.
  const soundButton = document.getElementById("sound");
  let audioCtx = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem("joke-sound") !== "off"; } catch {}

  function renderSoundButton() {
    soundButton.textContent = soundOn ? "🔊" : "🔇";
    soundButton.setAttribute("aria-pressed", String(soundOn));
    soundButton.setAttribute("aria-label", soundOn ? "צלילים פועלים. לחיצה משתיקה" : "צלילים מושתקים. לחיצה מפעילה");
  }

  function unlockAudio() {
    if (!soundOn) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    audioCtx = audioCtx || new AudioCtx();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function drum(time, freq) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, time);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, time + 0.15);
    gain.gain.setValueAtTime(0.7, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.22);
  }

  function cymbal(time) {
    const length = audioCtx.sampleRate * 0.8;
    const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 7000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.4, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.7);
    noise.connect(filter).connect(gain).connect(audioCtx.destination);
    noise.start(time);
    noise.stop(time + 0.8);
  }

  function badumTss() {
    if (!soundOn || !audioCtx) return;
    const t = audioCtx.currentTime + 0.02;
    drum(t, 190);
    drum(t + 0.16, 130);
    cymbal(t + 0.34);
  }

  soundButton.addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("joke-sound", soundOn ? "on" : "off"); } catch {}
    renderSoundButton();
    unlockAudio();
  });
  renderSoundButton();

  // קונפטי שמתפוצץ מהבועה כשמגיעה בדיחה. בלי ספרייה: קנבס אחד ומאתיים פיסות נייר.
  const CONFETTI_COLORS = ["#F23D2F", "#FFE15A", "#2E9BFF", "#FF5FA8", "#1FCB8C", "#8B5CF6"];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let confettiCanvas = null;

  function burstConfetti() {
    if (reduceMotion.matches) return;
    if (!confettiCanvas) {
      confettiCanvas = document.createElement("canvas");
      confettiCanvas.className = "confetti";
      confettiCanvas.setAttribute("aria-hidden", "true");
      document.body.appendChild(confettiCanvas);
    }
    const ratio = window.devicePixelRatio || 1;
    const width = window.innerWidth;
    const height = window.innerHeight;
    confettiCanvas.width = width * ratio;
    confettiCanvas.height = height * ratio;
    const ctx = confettiCanvas.getContext("2d");
    ctx.scale(ratio, ratio);

    const box = bubble.getBoundingClientRect();
    const originX = box.left + box.width / 2;
    const originY = box.top + 20;
    const pieces = Array.from({ length: 200 }, () => {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2;
      const speed = 6 + Math.random() * 9;
      return {
        x: originX + (Math.random() - 0.5) * box.width * 0.6,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 6 + Math.random() * 6,
        spin: (Math.random() - 0.5) * 0.4,
        turn: Math.random() * Math.PI,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      };
    });

    const start = performance.now();
    function frame(now) {
      const t = now - start;
      ctx.clearRect(0, 0, width, height);
      for (const p of pieces) {
        p.vy += 0.28;
        p.vx *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        p.turn += p.spin;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - t / 2600);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.turn);
        ctx.fillStyle = p.color;
        // Math.cos יוצר את האפקט של נייר שמתהפך באוויר
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, (p.size / 2) * Math.abs(Math.cos(p.turn * 2)) + 1);
        ctx.restore();
      }
      if (t < 2600) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, width, height);
    }
    requestAnimationFrame(frame);
  }

  function show(state, text) {
    const t = TEXT[mode];
    bubble.dataset.state = state;
    message.textContent = text;
    button.textContent = { idle: t.go, think: "חושב...", error: "לנסות שוב" }[state] ?? t.again;
    button.disabled = state === "think";
    reveal.hidden = state !== "question";
    answerBox.hidden = state !== "answer";
    // בבדיחה החגיגה באה מיד. בטריוויה היא מחכה לתשובה.
    if (state === "joke" || state === "answer") {
      burstConfetti();
      badumTss();
    }
  }

  function applyMode() {
    topicLabel.textContent = TEXT[mode].label;
    currentTrivia = null;
    show("idle", TEXT[mode].idle);
  }

  for (const radio of document.querySelectorAll('input[name="mode"]')) {
    radio.addEventListener("change", () => {
      mode = radio.value;
      try { localStorage.setItem("joke-mode", mode); } catch {}
      applyMode();
    });
  }

  reveal.addEventListener("click", () => {
    if (!currentTrivia) return;
    unlockAudio();
    answerText.textContent = currentTrivia.answer;
    answerWhy.textContent = currentTrivia.explanation;
    show("answer", currentTrivia.question);
  });

  applyMode();

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    unlockAudio();
    const topic = topicInput.value.trim();
    const requestMode = mode;
    show("think", TEXT[requestMode].think(topic));

    try {
      const response = await fetch("/api/joke", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic, mode: requestMode, avoid: requestMode === "trivia" ? recentQuestions : [] }),
      });
      const data = await response.json().catch(() => ({}));
      if (requestMode !== mode) return; // המצב הוחלף בזמן ההמתנה
      if (requestMode === "trivia" && response.ok && data.question && data.answer) {
        currentTrivia = data;
        rememberQuestion(data.question);
        show("question", data.question);
      } else if (requestMode === "joke" && response.ok && data.joke) {
        show("joke", data.joke);
      } else {
        show("error", data.error || TEXT[requestMode].lost);
      }
    } catch (error) {
      console.error(error);
      show("error", "אין חיבור לאינטרנט. נסו שוב.");
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
